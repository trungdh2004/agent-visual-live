[project]
name = "claude-session-monitor"
version = "0.1.0"
description = "Live dashboard for concurrent Claude Code sessions on this machine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csm"]
